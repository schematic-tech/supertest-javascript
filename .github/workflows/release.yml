# Actions are pinned to commit SHAs; Dependabot maintains these pins.
name: Release
'on':
  push:
    tags:
    - v*
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'schematic-tech/supertest-javascript'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python scripts/release.py guard
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: dist
    - run: python scripts/release.py verify-assets
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
        package-manager-cache: false
        registry-url: https://registry.npmjs.org
    - run: npm install --global npm@11.16.0
    - run: python scripts/publish.py
      env:
        NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
    - run: python scripts/release.py github
      env:
        GH_TOKEN: ${{ github.token }}
